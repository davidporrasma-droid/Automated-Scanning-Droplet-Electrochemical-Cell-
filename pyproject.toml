[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "sdc-control"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "requests", "pyserial"]
[project.optional-dependencies]
lab = ["notebook", "nest_asyncio", "easy_biologic"]
test = ["pytest"]
[tool.setuptools.packages.find]
include = ["sdc*"]
